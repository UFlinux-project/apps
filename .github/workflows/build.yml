name: Build and publish apps

# Every package is built in its own shard: an Alpine chroot unpacked from a
# locked minirootfs, created, used and thrown away by scripts/build.py. What is
# published is the APK repository itself, served by GitHub Pages out of
# out/pages, so no commit step or extra branch is involved.
#
# A run that publishes rebuilds what it was asked to rebuild and takes the rest
# from the repository already deployed, so one failed shard no longer holds up
# the packages that did build. See the publish job.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          Comma-separated package names to rebuild (empty = every package). A
          scoped list still publishes a complete repository: everything not
          listed is carried over from the deployed site.
        required: false
        default: ''
  schedule:
    # Weekly rebuild, so a new Alpine point release or a new upstream release
    # shows up without anyone having to remember.
    - cron: '30 4 * * 1'

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    runs-on: ubuntu-26.04
    outputs:
      packages: ${{ steps.matrix.outputs.packages }}
      full: ${{ steps.matrix.outputs.full }}
      scoped: ${{ steps.matrix.outputs.scoped }}
      expect: ${{ steps.matrix.outputs.expect }}
      release: ${{ steps.matrix.outputs.release }}
      epoch: ${{ steps.matrix.outputs.epoch }}
      cache: ${{ steps.matrix.outputs.cache }}
      repository: ${{ steps.matrix.outputs.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate shell, Python and this workflow
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck busybox-static
          # Every shell file we ship, found rather than globbed: the recipes, the
          # helper they source (which sits beside the package directories, not
          # inside one, so `aports/apps/*/*.sh` misses it), and the scripts a
          # recipe installs rather than sources. The prunes keep a local build's
          # unpacked source tree out of the way: on CI it does not exist, but the
          # same command should be runnable after building in place.
          mapfile -t shell_files < <(
            find aports scripts \
              \( -name src -o -name pkg -o -name tmp \) -prune -o \
              \( -name '*.sh' -o -name APKBUILD \) -print | sort
          )
          echo "Checking ${#shell_files[@]} shell files"
          shellcheck -S warning "${shell_files[@]}"
          # abuild runs recipes with ash, which is stricter than the runner's sh:
          # ${var^^} and friends parse fine under bash and fail mid-build.
          for file in "${shell_files[@]}"; do
            busybox ash -n "$file"
          done
          # A '#' inside a multi-line list is a shell comment to a reader, but
          # abuild word-splits depends=/makedepends=/subpackages= and hands every
          # word to apk, so the comment becomes a package name and the build dies
          # with "'<word>' is not a valid package dependency". That only shows up
          # in the build job, minutes into the deps stage, so catch it here.
          if list_comments=$(awk '
            /^[a-z_][a-z0-9_]*="$/ { inlist = 1; next }
            inlist && /^[[:space:]]*"$/ { inlist = 0; next }
            inlist && /^[[:space:]]*#/ { printf "%s:%d: %s\n", FILENAME, FNR, $0 }
          ' "${shell_files[@]}"); [ -n "$list_comments" ]; then
            echo '::error::comment lines inside a quoted list are passed to apk as' \
              'package names; move them above the assignment' >&2
            echo "$list_comments" >&2
            exit 1
          fi
          for script in scripts/*.py; do python3 -m py_compile "$script"; done
          go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
          # Every workflow, not just the one that publishes: update.yml has the
          # same embedded shell to lint and the same runner labels to check.
          "$(go env GOPATH)/bin/actionlint" -config-file .github/actionlint.yaml .github/workflows/*.yml
      - name: Check that generated recipes are committed
        run: |
          python3 scripts/gen-app-recipes.py
          # git status, not git diff: adding an app to the lockfile without
          # committing its new recipe produces an untracked file, which a diff
          # does not see, and the failure would otherwise surface once per
          # architecture as "APKBUILD: No such file or directory".
          git add -A aports
          git diff --cached --quiet -- aports || {
            echo 'recipes are stale or missing, run: python3 scripts/gen-app-recipes.py' >&2
            git status --short -- aports
            exit 1
          }
      - name: Check that shipped distfiles match their checksums
        run: python3 scripts/check-distfiles.py
      - name: Check that the lockfile tracks upstream
        # Informational, and deliberately not fatal: a release published
        # yesterday is not a defect in the change being built, and it must not
        # hold up publication of everything else. The weekly schedule run is
        # where this annotation is meant to show up. A hash that is simply wrong
        # is caught by abuild during the build, not here: checking it means
        # downloading the tarball. The files a recipe ships rather than
        # downloads are checked by the step above, without a download.
        run: python3 scripts/update-checksums.py --check ||
          echo "::warning::config/apps.lock.json is behind upstream, run scripts/update-checksums.py"
      - name: Check that uflinux-files tracks upstream
        # Same rule as the lockfile check above: uflinux-files has no releases,
        # so being behind the file manager's default branch is normal and only
        # the daily update job is meant to act on it.
        run: python3 scripts/update-files.py --check ||
          echo "::warning::uflinux-files is behind upstream's default branch, run scripts/update-files.py"
      - name: Check that mission-center tracks upstream
        # Same rule again: mission-center does have tagged releases, but being
        # behind the newest one is equally normal here and only the daily update
        # job is meant to act on it.
        run: python3 scripts/update-mission-center.py --check ||
          echo "::warning::mission-center is behind upstream's newest release, run scripts/update-mission-center.py"
      - id: matrix
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PACKAGES: ${{ github.event.inputs.packages }}
        run: python3 scripts/ci-matrix.py
      - name: Check that a run which publishes can sign
        # Fail here rather than after every compile shard: without the key each
        # shard generates its own throwaway, the index then rejects every APK as
        # "BAD signature", and the run that discovers this is the expensive one.
        # A tag pushed to a fork is the case this catches. The secrets are read
        # through env, because the secrets context is not available in `if`.
        if: steps.matrix.outputs.full == 'true'
        env:
          PRIVATE: ${{ secrets.APK_SIGNING_PRIVATE_KEY }}
          PUBLIC: ${{ secrets.APK_SIGNING_PUBLIC_KEY }}
        run: |
          if [ -z "$PRIVATE" ] || [ -z "$PUBLIC" ]; then
            echo "::error::This run would publish, but APK_SIGNING_PRIVATE_KEY" \
              "and APK_SIGNING_PUBLIC_KEY are not set, so the repository could" \
              "not be signed with the key UFLinux trusts."
            exit 1
          fi

  compile:
    needs: checks
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.checks.outputs.packages) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      SOURCE_DATE_EPOCH: ${{ needs.checks.outputs.epoch }}
      # abuild signs every APK it produces, and `apk index` refuses to describe a
      # package whose signature it cannot verify. The index happens in a different
      # job, so the key has to be the same one here - without these secrets each
      # shard generates its own throwaway key and the index job fails with
      # "BAD signature" on every APK. A pull request from a fork cannot read them,
      # and gets throwaway keys; that run does not publish either.
      APK_SIGNING_PRIVATE_KEY: ${{ secrets.APK_SIGNING_PRIVATE_KEY }}
      APK_SIGNING_PUBLIC_KEY: ${{ secrets.APK_SIGNING_PUBLIC_KEY }}
      # No CARGO_BUILD_JOBS here: build.py compares the target architecture
      # against the runner's own `uname -m`, which is the same fact
      # `matrix.emulated` is derived from, and it also knows what to do about the
      # single-threaded final link that emulation makes expensive. Keeping the
      # rule in one place is what keeps the two from disagreeing - including the
      # reduced job count for aarch64, which lives beside that rule rather than
      # here. Setting it here would take it out of build.py's control without
      # taking it out of the local build's: `env -i` in the chroot drops any
      # variable build.py does not forward on purpose.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare architecture emulation
        if: matrix.emulated == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-user-binfmt binfmt-support
      # The ARM runner is the same 4 vCPU / 16 GB / 14 GB SSD machine as the
      # x86_64 one, but a few of the bigger Rust builds lose it near the end of
      # the compile: the log stops after the last `Compiling` line with "The
      # runner has received a shutdown signal" and exit code 143, reproducibly,
      # from a cold cache on a fresh VM. GitHub documents that signature - a
      # workload that runs out of RAM and swap takes the VM down before the
      # kernel can write an OOM record, so the job cannot tell memory pressure
      # apart from any other way to lose a runner.
      #
      # So give the build somewhere to go when it runs out of memory - but not
      # by taking the space the build itself needs. Swap is disk, and the only
      # disk a hosted runner guarantees is the 14 GB one the build is already
      # required to have 10 GiB of, so a swapfile sized by wishful thinking
      # would trip build.py's own disk check and turn a failure into a
      # certainty. The step therefore asks the machine how much it can spare and
      # builds the file on whichever filesystem has the most room; on a runner
      # with nothing to spare it changes nothing, which is the state the job was
      # in before. Whether the image ships swap is not documented either way, so
      # that is looked up too rather than assumed.
      - name: Add swap for the ARM runner
        if: matrix.runner == 'ubuntu-26.04-arm'
        run: |
          set -eu
          # Whole GiB of swap already present. A few hundred megabytes would not
          # survive the end of this build, so only a real amount counts.
          have=$(( $(awk '/^SwapTotal:/{print $2}' /proc/meminfo) / 1048576 ))
          if [ "$have" -ge 4 ]; then
            echo "Runner already has ${have} GiB of swap; leaving it alone."
            exit 0
          fi
          # The build's own minimum plus a gigabyte of margin: whatever is left
          # after the swapfile has to satisfy the 10 GiB build.py refuses to
          # start without, on the filesystem the build runs on, and df rounds
          # its figures up.
          keep=11
          # Whichever of the two filesystems a runner offers has the most room.
          # /mnt is the temporary disk and the workspace is where the build
          # actually runs; on some runners they are the same filesystem, on
          # others the temporary one is far larger, and the point of asking is
          # that the job does not have to know which runner it got.
          disk=$(df -BG --output=target,avail /mnt "$GITHUB_WORKSPACE" 2>/dev/null |
                 tail -n +2 | sort -k2 -nr | head -n1 | cut -d' ' -f1)
          [ -n "$disk" ] || disk="$GITHUB_WORKSPACE"
          avail=$(df -BG --output=avail "$disk" | tail -n1 | tr -dc '0-9')
          size=$(( avail < keep + 6 ? avail - keep : 6 ))
          if [ "$size" -lt 2 ]; then
            echo "::warning::no room for a swapfile next to the build; continuing without extra swap"
            exit 0
          fi
          file="$disk/ci-swap"
          if sudo fallocate -l "${size}GiB" "$file" 2>/dev/null ||
             sudo dd if=/dev/zero of="$file" bs=1M count=$(( size * 1024 )) status=none; then
            sudo chmod 600 "$file"
            sudo mkswap "$file" >/dev/null
            # Not fatal: a filesystem that refuses a swapfile leaves the job in
            # the position it was in before, and a build that fits in memory
            # anyway should not be failed by the step meant to help it.
            sudo swapon "$file" || echo "::warning::swapon failed; continuing without extra swap"
          else
            sudo rm -f "$file"
            echo "::warning::could not create a swapfile; continuing without extra swap"
          fi
          free -m
          df -h "$disk"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache
        with:
          path: .cache/build/${{ matrix.arch }}
          key: apps-v1-${{ matrix.arch }}-${{ matrix.package }}-${{ needs.checks.outputs.cache }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            apps-v1-${{ matrix.arch }}-${{ matrix.package }}-${{ needs.checks.outputs.cache }}-
      - name: Build
        run: |
          timeout --signal=INT --kill-after=60s 330m \
            sudo --preserve-env=SOURCE_DATE_EPOCH,CARGO_BUILD_JOBS,APK_SIGNING_PRIVATE_KEY,APK_SIGNING_PUBLIC_KEY \
            python3 scripts/build.py --arch '${{ matrix.arch }}' \
              --package '${{ matrix.package }}' --stage packages
      - name: Make the cache readable
        # build.py widens the cache permissions on the way out so the upload
        # below can read what root wrote.  A shard killed by the step timeout
        # never gets there, and actions/cache/save then fails on tar "Permission
        # denied" - which loses the whole cache and leaves the retry to rebuild
        # from cold, the situation that puts an emulated shard past its time
        # limit in the first place.  Same repair, from the host, unconditionally.
        if: always()
        run: |
          dir=.cache/build/${{ matrix.arch }}
          if [ -d "$dir" ]; then sudo chmod -R a+rX "$dir"; fi
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always()
        with:
          path: .cache/build/${{ matrix.arch }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-${{ matrix.arch }}-${{ matrix.package }}
          path: out/packages/${{ matrix.arch }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  publish:
    # Gate on ci-matrix.py's own decision rather than a copy of it: publishing
    # replaces the whole repository, so it may only happen from a run that built
    # every architecture - a push to the watched branch builds x86_64 alone and
    # would otherwise deploy a site missing the other three. A pull request
    # cannot sign the result anyway, and deploying with an ephemeral key would
    # lock every client out. Forks still get every package built on x86_64.
    #
    # `!cancelled()` is what makes a release survive a failed shard: without it
    # one red shard skips this job and every package that did build goes
    # unpublished. The job then rebuilds the repository from the artifacts that
    # arrived plus whatever build.py carries over from the deployed site, so a
    # package whose shard failed keeps the version already published. A run
    # where a package is neither built nor published fails in build.py instead
    # of quietly shrinking the repository.
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.checks.outputs.full == 'true' }}
    needs: [checks, compile]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: release-publication
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # merge-multiple stays off, so every artifact keeps its own directory and
      # collect-packages.py can read the architecture back out of its name.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: apk-*
          path: .spool
      - name: Sort packages into their architecture
        run: python3 scripts/collect-packages.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - name: Index and sign the repository
        env:
          SOURCE_DATE_EPOCH: ${{ needs.checks.outputs.epoch }}
          APK_SIGNING_PRIVATE_KEY: ${{ secrets.APK_SIGNING_PRIVATE_KEY }}
          APK_SIGNING_PUBLIC_KEY: ${{ secrets.APK_SIGNING_PUBLIC_KEY }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          SCOPED: ${{ needs.checks.outputs.scoped }}
          EXPECT: ${{ needs.checks.outputs.expect }}
        run: |
          expect=()
          # A scoped run promises a complete repository, so it has to say which
          # names it is on the hook for: a package that was neither rebuilt nor
          # already published means the release would drop it, and build.py
          # fails rather than publishing a smaller repository. A full run does
          # not need the promise - it rebuilt everything, so anything missing
          # from the spool is a shard that failed, and carry-over alone is what
          # keeps that package published.
          if [ "$SCOPED" = true ]; then
            expect=(--expect-packages "$EXPECT")
          fi
          sudo --preserve-env=SOURCE_DATE_EPOCH,APK_SIGNING_PRIVATE_KEY,APK_SIGNING_PUBLIC_KEY,PAGES_BASE_URL \
            python3 scripts/build.py --stage index "${expect[@]}"
      - name: Summary
        env:
          RELEASE: ${{ needs.checks.outputs.release }}
          SCOPED: ${{ needs.checks.outputs.scoped }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          REPOSITORY: ${{ needs.checks.outputs.repository }}
          COMPILE_RESULT: ${{ needs.compile.result }}
        run: |
          {
            echo "### $(find out/pages -name '*.apk' | wc -l) packages, $(find out/pages -name APKINDEX.tar.gz | wc -l) architectures"
            echo
            echo "Published \`$BASE_URL/$REPOSITORY\` (release=$RELEASE)."
            if [ "$SCOPED" = true ]; then
              echo
              echo "Rebuilt only the packages this release bumped; every other" \
                "package was carried over from the previous deployment."
            fi
            if [ "$COMPILE_RESULT" != success ]; then
              echo
              echo "> [!WARNING]"
              echo "> At least one build shard failed (compile=$COMPILE_RESULT)."
              echo "> Those packages keep the version already published, or are" \
                "missing from this release if they never were."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: out/pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
